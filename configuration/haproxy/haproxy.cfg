# NordicShop load balancer
# ---------------------------------------------------------------------------
# Runs on lb01 (192.168.56.10). Frontend receives customer traffic on port 80
# and forwards it to the two Nginx nodes.
#
# Mode note: this configuration uses `mode http` so the health check can request
# /healthz and assert a 200 response. The original brief called for TCP mode,
# which can only test that a socket accepts a connection. The trade-off, and the
# TCP equivalent, are written up in documentation/phase-4-load-balancer.md.
# ---------------------------------------------------------------------------

global
    # Log to the local syslog socket. rsyslog must be configured to route
    # local0 to a file; see the deploy notes.
    log         /dev/log local0 info
    maxconn     2048
    # Administration socket: used for `echo "show stat" | socat ...` and for
    # graceful reloads without dropping connections.
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user        haproxy
    group       haproxy
    daemon

defaults
    mode                    http
    log                     global
    option                  httplog
    option                  dontlognull

    # Timeouts are deliberately short. The backends answer in milliseconds, so a
    # 3 second connect timeout distinguishes "slow" from "broken" quickly, and a
    # 30 second client timeout protects against half-open connections. Without
    # these, a dropped packet from a backend would hang customers for minutes -
    # exactly the failure seen in Phase 3 when the firewall dropped packets.
    timeout connect         3s
    timeout client          30s
    timeout server          30s
    timeout http-request    10s
    timeout http-keep-alive 5s

    # If a server fails mid-request, retry on another node instead of returning
    # an error to the customer.
    option                  redispatch
    retries                 2


frontend nordicshop_front
    # Binding to the service address rather than 0.0.0.0 keeps the frontend off
    # the NAT interface, so the only way in is the lab network.
    bind                    192.168.56.10:80
    default_backend         nordicshop_web

    # Give backends the real client address. At Layer 7 this works via a header;
    # a Layer 4 balancer cannot do this without the PROXY protocol.
    option                  forwardfor

    # Make it obvious in a response that it passed through the balancer.
    http-response set-header X-Load-Balancer lb01


backend nordicshop_web
    # roundrobin: each new request goes to the next healthy server in turn.
    # Chosen because both nodes are identical, long-lived connections are not
    # expected from curl or a browser over plain HTTP, and it makes the
    # distribution visibly even in the test output. leastconn would be the better
    # choice if requests had very different durations; source would pin a client
    # to one node and hide a failure behind a single test client.
    balance                 roundrobin

    # Health check: a real HTTP request, not just a TCP connect.
    #   - GET /healthz must return 200
    #   - every 2s while healthy, every 500ms while transitioning
    #   - 3 consecutive failures mark the node down, 2 successes bring it back
    option                  httpchk GET /healthz
    http-check              expect status 200
    default-server          inter 2s fastinter 500ms downinter 5s fall 3 rise 2

    server web01 192.168.56.21:80 check
    server web02 192.168.56.22:80 check


listen stats
    # Statistics page, bound to the lab address only. /stats;csv is machine
    # readable and is what the verification script reads.
    bind                    192.168.56.10:8404
    stats                   enable
    stats                   uri /stats
    stats                   refresh 5s
    stats                   show-legends
