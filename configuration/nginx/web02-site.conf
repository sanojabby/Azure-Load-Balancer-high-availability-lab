# NordicShop web tier - node 2
# Installed as /etc/nginx/sites-available/nordicshop on web02.
# Deliberately identical to node 1 except for the node name, so any behavioural
# difference in Phase 4 comes from the load balancer, not from the web tier.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name web02.nordicshop.lab web02;

    root /var/www/nordicshop;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok web02\n";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Web-Node "web02" always;
        add_header Cache-Control "no-store" always;
    }

    access_log /var/log/nginx/nordicshop-access.log;
    error_log  /var/log/nginx/nordicshop-error.log;
}
