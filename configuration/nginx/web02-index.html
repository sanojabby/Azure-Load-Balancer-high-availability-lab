<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NordicShop - Web Node 2</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #1d2a1f; color: #f2f8f2; }
    main { max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; }
    h1 { font-size: 1.9rem; margin-bottom: .25rem; }
    .tag { display: inline-block; padding: .2rem .6rem; border-radius: 999px;
           background: #2f8f4e; font-size: .8rem; letter-spacing: .05em; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: .35rem 1rem;
         margin-top: 2rem; border-top: 1px solid #35543a; padding-top: 1.5rem; }
    dt { color: #a8c4ad; }
    code { background: #24382a; padding: .1rem .35rem; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <span class="tag">NODE 2</span>
    <h1>NordicShop</h1>
    <p>This page is served by the second web server in the pool.</p>
    <dl>
      <dt>Hostname</dt><dd><code>web02</code></dd>
      <dt>Address</dt><dd><code>192.168.56.22</code></dd>
      <dt>Health check</dt><dd><code>/healthz</code></dd>
      <dt>Served by</dt><dd>Nginx, Ubuntu 24.04</dd>
    </dl>
  </main>
</body>
</html>
