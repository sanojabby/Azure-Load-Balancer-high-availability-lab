# NordicShop web tier - node 1
# Installed as /etc/nginx/sites-available/nordicshop on web01.
#
# Two things matter here beyond serving a page:
#
# 1. /healthz is a real endpoint with a known response body. A load balancer
#    that only checks "is the port open" cannot tell a working node from one
#    whose worker processes are wedged. This endpoint is what HAProxy will
#    probe in Phase 4.
#
# 2. The X-Web-Node response header makes it unambiguous which backend answered
#    a request. Without it, round-robin balancing looks identical to a single
#    server behind a cache.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name web01.nordicshop.lab web01;

    root /var/www/nordicshop;
    index index.html;

    # Health endpoint used by the load balancer.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok web01\n";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Web-Node "web01" always;
        add_header Cache-Control "no-store" always;
    }

    access_log /var/log/nginx/nordicshop-access.log;
    error_log  /var/log/nginx/nordicshop-error.log;
}
